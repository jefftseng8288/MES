services:
  postgres:
    image: postgres:16
    # Auto-restart (incl. after a Mac reboot, once Docker Desktop is up) so the
    # daily harvest daemon always finds the DB running. Not "always" — respects a
    # deliberate `docker compose stop`.
    restart: unless-stopped
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes_dev_password
    ports:
      - "5432:5432"
    volumes:
      - mes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mes_postgres_data:
