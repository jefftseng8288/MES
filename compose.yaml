services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes_dev_password
    ports:
      - "5432:5432"
    volumes:
      - mes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mes_postgres_data:
